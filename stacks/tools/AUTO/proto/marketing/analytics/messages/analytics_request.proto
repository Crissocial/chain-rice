syntax = "proto3";

package marketing.analytics.messages;

import "google/protobuf/timestamp.proto";
import "marketing/analytics/enums/analytics_type.proto";

// Request to create a new analytics record
message CreateAnalyticsRequest {
  string name = 1;                                // Analytics name
  marketing.analytics.enums.AnalyticsType type = 2; // Type of analytics
  string description = 3;                         // Optional description
  string data_source = 4;                         // Source of data
  string metrics_data = 5;                        // Metrics as JSON
  string campaign_id = 6;                         // Optional campaign association
  google.protobuf.Timestamp date = 7;            // Date of the data
}

// Request to fetch a single analytics record by ID
message GetAnalyticsRequest {
  string id = 1;                                  // Unique analytics ID
}

// Request to list multiple analytics records with optional filters
message ListAnalyticsRequest {
  int32 page_size = 1;                            // Number of records per page
  string page_token = 2;                          // Pagination token
  marketing.analytics.enums.AnalyticsType type = 3; // Optional type filter
  string campaign_id = 4;                         // Optional campaign filter
  google.protobuf.Timestamp start_date = 5;       // Optional start date
  google.protobuf.Timestamp end_date = 6;         // Optional end date
}

// Request to update an existing analytics record
message UpdateAnalyticsRequest {
  string id = 1;                                  // ID of the record to update
  string name = 2;                                // Updated name
  marketing.analytics.enums.AnalyticsType type = 3; // Updated type
  string description = 4;                         // Updated description
  string data_source = 5;                         // Updated source
  string metrics_data = 6;                        // Updated metrics JSON
  google.protobuf.Timestamp date = 7;            // Updated date
}

// Request to delete an analytics record
message DeleteAnalyticsRequest {
  string id = 1;                                  // ID of the record to delete
}
