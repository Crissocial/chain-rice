syntax = "proto3";

package marketing.analytics.messages;

import "google/protobuf/timestamp.proto";
import "marketing/analytics/enums/analytics_type.proto";

// Core Analytics DTO (Data Transfer Object)
message Analytics {
  string id = 1;                              // Unique analytics ID
  string name = 2;                            // Analytics name
  marketing.analytics.enums.AnalyticsType type = 3; // Type of analytics
  string description = 4;                     // Optional description
  string data_source = 5;                     // Source of the data
  string metrics_data = 6;                    // Metrics as JSON
  string campaign_id = 7;                     // Optional campaign association
  google.protobuf.Timestamp date = 8;        // Date of the data
  google.protobuf.Timestamp created_at = 9;  // Creation timestamp
  google.protobuf.Timestamp updated_at = 10; // Last update timestamp
  AnalyticsSummary summary = 11;             // Optional summary metrics
}

// Summary metrics for an analytics record
message AnalyticsSummary {
  int64 total_views = 1;        // Total views/impressions
  int64 total_clicks = 2;       // Total clicks
  int64 total_conversions = 3;  // Total conversions
  double conversion_rate = 4;   // Conversion rate
  double ctr = 5;               // Click-through rate
  double total_revenue = 6;     // Total revenue
  double cpa = 7;               // Cost per acquisition
  double roas = 8;              // Return on ad spend
}

// Response for creating a new analytics record
message CreateAnalyticsResponse {
  Analytics analytics = 1;      // Created record
  string message = 2;           // Optional success message
}

// Response for fetching a single analytics record
message GetAnalyticsResponse {
  Analytics analytics = 1;      // Requested record
}

// Response for listing multiple analytics records
message ListAnalyticsResponse {
  repeated Analytics analytics = 1; // List of records
  int32 total_count = 2;             // Optional total number of records
  int32 page = 3;                    // Current page number
  int32 page_size = 4;               // Items per page
}

// Response for updating an analytics record
message UpdateAnalyticsResponse {
  Analytics analytics = 1;      // Updated record
  string message = 2;           // Optional success message
}

// Response for deleting an analytics record
message DeleteAnalyticsResponse {
  string message = 1;           // Optional success message
}
