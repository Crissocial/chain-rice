syntax = "proto3";

package marketing.analytics.services;

import "marketing/analytics/messages/analytics_request.proto";
import "marketing/analytics/messages/analytics_response.proto";

// Service for managing marketing analytics data
service AnalyticsService {

  // Create a new analytics record
  rpc CreateAnalytics(marketing.analytics.messages.CreateAnalyticsRequest) 
      returns (marketing.analytics.messages.CreateAnalyticsResponse);

  // Get a single analytics record by ID
  rpc GetAnalytics(marketing.analytics.messages.GetAnalyticsRequest) 
      returns (marketing.analytics.messages.GetAnalyticsResponse);

  // List multiple analytics records with optional filters and pagination
  rpc ListAnalytics(marketing.analytics.messages.ListAnalyticsRequest) 
      returns (marketing.analytics.messages.ListAnalyticsResponse);

  // Update an existing analytics record
  rpc UpdateAnalytics(marketing.analytics.messages.UpdateAnalyticsRequest) 
      returns (marketing.analytics.messages.UpdateAnalyticsResponse);

  // Delete an analytics record by ID
  rpc DeleteAnalytics(marketing.analytics.messages.DeleteAnalyticsRequest) 
      returns (marketing.analytics.messages.DeleteAnalyticsResponse);
}
