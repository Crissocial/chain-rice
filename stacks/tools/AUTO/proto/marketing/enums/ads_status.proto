syntax = "proto3";

package marketing.enums;

// Enumeration for advertisement status
enum AdsStatus {
  // Default status - not specified
  UNSPECIFIED = 0;
  
  // Advertisement is being drafted
  DRAFT = 1;
  
  // Advertisement is pending approval
  PENDING = 2;
  
  // Advertisement is approved and active
  ACTIVE = 3;
  
  // Advertisement is paused
  PAUSED = 4;
  
  // Advertisement is rejected
  REJECTED = 5;
  
  // Advertisement is completed
  COMPLETED = 6;
  
  // Advertisement is archived
  ARCHIVED = 7;
}
