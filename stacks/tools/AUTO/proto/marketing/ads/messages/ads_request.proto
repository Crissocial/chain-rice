syntax = "proto3";

package marketing.ads.messages;

import "google/protobuf/timestamp.proto";
import "marketing/ads/enums/ads_status.proto";

// Request to create a new ad
message CreateAdRequest {
  // Title of the advertisement
  string name = 1;

  // Description of the ad
  string description = 2;

  // Main content for the ad (text, HTML, etc.)
  string content = 3;

  // Budget allocated for this ad
  double budget = 4;

  // Optional: who is creating this ad (user ID or staff ID)
  string created_by = 5;

  // Optional start date for scheduling the ad
  google.protobuf.Timestamp start_date = 6;

  // Optional end date for scheduling the ad
  google.protobuf.Timestamp end_date = 7;

  // Optional tags or categories to classify the ad
  repeated string tags = 8;

  // Optional location ID if ads are location-specific
  string location_id = 9;
}

// Request to fetch a single ad by its ID
message GetAdRequest {
  // Unique ID of the ad to fetch
  string id = 1;
}

// Request to list multiple ads with optional filters and pagination
message ListAdsRequest {
  // Maximum number of ads to return
  int32 page_size = 1;

  // Token for pagination (used for fetching next page)
  string page_token = 2;

  // Optional: filter by ad status
  marketing.ads.enums.AdsStatus status = 3;

  // Optional: filter by location ID
  string location_id = 4;
}

// Request to update an existing ad
message UpdateAdRequest {
  // Unique ID of the ad to update
  string id = 1;

  // New values for the ad (can include any subset of fields)
  Ad ad = 2;

  // Specifies which fields should be updated (partial updates)
  google.protobuf.FieldMask update_mask = 3;
}

// Request to delete an ad
message DeleteAdRequest {
  // Unique ID of the ad to delete
  string id = 1;
}
